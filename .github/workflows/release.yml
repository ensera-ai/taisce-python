#
# A release is a tag, built and published by this workflow through PyPI trusted publishing: no
# long-lived token exists anywhere, and each package carries a provenance attestation.
#
# ── WHY PUBLICATION IS THREE JOBS AND NOT ONE ────────────────────────────────────────────────────
#
# This repository holds three distributions, and PyPI identifies a trusted publisher by the claims
# in the OIDC token: owner, repository, workflow and environment. Publishing all three from one job
# presents one identical claim set for three different project names, which PyPI refuses — it cannot
# tell which project an upload belongs to. So each distribution publishes from its own job under its
# own environment, which is what makes the three claim sets distinct.
#
# The environment is also the approval gate: a reviewer required on the environment holds the upload
# until somebody says yes, and a package that has left for PyPI cannot be recalled.
#
# The environments admit only `v*.*.*` tags, so a job on a branch cannot mint a token PyPI accepts.
# Actions are referenced by commit SHA: a tag can be moved by whoever controls the action's
# repository, and a moved tag would run their code in the job that holds the publishing token.
#
# ── WHY THE TAG IS CHECKED BEFORE ANYTHING ELSE ─────────────────────────────────────────────────
#
# Each package is built with the version its `pyproject.toml` holds, and its attestation names the tag
# that started the run. If the two disagree, one version is published with provenance naming another,
# and PyPI cannot take it back. So the first step refuses the run unless every package's version is the
# tag without its `v`. It runs before anything is installed, built or attested, so a refused run leaves
# nothing behind. `scripts/release_version.py` says what it does not check.
name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/release_version.py "$GITHUB_REF_NAME"
      - run: pip install -e ./client -e ./agent-framework -e ./langgraph pytest pytest-asyncio build
      - run: pytest client/tests agent-framework/tests langgraph/tests -q
      - run: |
          set -euo pipefail
          for p in client agent-framework langgraph; do python -m build --outdir "dist/$p" "$p"; done
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/

  taisce:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-taisce
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/client

  agent-framework:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-agent-framework
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/agent-framework

  langgraph:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-langgraph
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/langgraph
