#
# The deployment-free tests on every push and pull request. The conformance suite needs a live
# deployment and the service's runner; its output is the evidence an adapter release carries.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Referenced by commit SHA, as release.yml explains: a tag can be moved by whoever controls it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -e ./client -e ./agent-framework -e ./langgraph pytest pytest-asyncio
      - run: pytest client/tests agent-framework/tests langgraph/tests tests -q
